[package]
name = "jsonschema-valid"
version = "0.5.2"
authors = ["Michael Droettboom <mdroettboom@mozilla.org>"]
description = "A simple JSON schema validator."
repository = "https://github.com/mdboom/jsonschema-valid"
readme = "README.md"
keywords = ["jsonschema"]
license = "MPL-2.0"
edition = "2024"

[dependencies]
serde_json = "1.0.25"
itertools = "0.15.0"
regex = { version = "1", default-features = false, features = ["std"] }
url = "2"
chrono = { version = "0.4", default-features = false }
iri-string = { version = "0.5.5", default-features = false }
json-pointer = "0.3"
percent-encoding = "2"
textwrap = { version = "0.16", default-features = false }
